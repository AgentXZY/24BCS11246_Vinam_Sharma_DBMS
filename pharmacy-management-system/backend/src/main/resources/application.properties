# ============================================================================
# PHARMACY MANAGEMENT SYSTEM - BACKEND CONFIGURATION
# ============================================================================
spring.application.name=pharmacy-management-system
server.port=8080

# Database Connection (Environment variables with sensible defaults)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmacy_management}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Harsh@179}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
# ddl-auto=none ensures database schema is governed strictly by PostgreSQL migration scripts
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Centralized Logging
logging.level.org.springframework.web=INFO
logging.level.com.pharmacy=INFO

